title: Jasper
description: 记录生活，也记录那些慢慢想清楚的事。
url: "https://www.wuspace.top"
baseurl: ""
lang: zh-CN
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
collections:
  notes:
    output: true
    permalink: /notes/:title/
  moments:
    output: true
    permalink: /moments/:title/
  memoirs:
    output: true
    permalink: /starry/:title/
defaults:
  - scope:
      type: notes
    values:
      layout: note
  - scope:
      type: moments
    values:
      layout: moment
  - scope:
      type: memoirs
    values:
      layout: note
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - assets/js/*.test.js
  - assets/media/README.md
