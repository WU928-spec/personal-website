<audio id="music-audio" preload="none" muted></audio>
<dialog class="music-dialog" id="music-dialog" closedby="any" aria-labelledby="music-title">
  <div class="music-shell">
    <div class="music-topbar">
      <span>音乐</span>
      <form method="dialog"><button class="music-close" type="submit" aria-label="关闭音乐播放器">×</button></form>
    </div>
    <img class="music-cover" id="music-cover" src="{{ '/assets/starry/starry-bg.jpg' | relative_url }}" alt="星空封面" width="640" height="640">
    <div class="music-meta">
      <h2 id="music-title">星空</h2>
      <p id="music-artist">Jasper</p>
    </div>
    <div class="music-progress-wrap">
      <input class="music-range" id="music-progress" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度">
      <div class="music-times"><span id="music-current">0:00</span><span id="music-duration">0:00</span></div>
    </div>
    <div class="music-controls">
      <button id="music-previous" type="button" aria-label="上一首">←</button>
      <button class="music-play" id="music-play" type="button" aria-label="播放" autofocus>▶</button>
      <button id="music-next" type="button" aria-label="下一首">→</button>
    </div>
    <label class="music-volume-wrap" for="music-volume"><span>音量</span><input class="music-range" id="music-volume" type="range" min="0" max="1" step="0.01" value="0"></label>
    <ol class="music-playlist" id="music-playlist" aria-label="播放列表"></ol>
  </div>
</dialog>
